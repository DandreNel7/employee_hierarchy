#Runs on the EC2 instance. Images are built built by GitHub Actions and pulled from ECR.
services:
  api:
    image: ${ECR_REGISTRY}/employee-hierarchy-api:${IMAGE_TAG:-latest}
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: "true"
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
    expose:
      - "8000"

  web:
    image: ${ECR_REGISTRY}/employee-hierarchy-web:${IMAGE_TAG:-latest}
    restart: always
    environment:
      ORIGIN_SECRET: ${ORIGIN_SECRET}
    ports:
      - "80:80"
    depends_on:
      - api
