[project]
name = "employee-hierarchy-api"
version = "0.1.0"
description = "API for the employee hierarchy app"
authors = [
    { name = "DandreNel7", email = "u24600726@tuks.co.za" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.94",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pwdlib[bcrypt]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.53",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "faker>=40.39.0",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
